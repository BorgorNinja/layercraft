name: Native libs smoke test

# Standalone validator for scripts/build-native-deps.sh, decoupled from the
# full release pipeline so the (likely to need iteration) cross-compile
# chain can be debugged without cutting a release each time.
#
# Manual trigger only -- this is expected to fail on first few runs while
# the glib/json-glib/babl/gegl meson flags get tuned for Android; see
# README.md "Known risk areas".

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Target ABI"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      api_level:
        description: "Android API level (must match app/build.gradle.kts minSdk)"
        required: true
        default: "28"

jobs:
  build-native-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ninja-build
          pip install --user meson

      - name: Locate NDK
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_HOME" ]; then
            echo "No NDK found on runner image (expected ANDROID_NDK_LATEST_HOME)." >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK_HOME"

      - name: Build glib -> json-glib -> babl -> gegl for ${{ inputs.abi }}
        id: build
        continue-on-error: true
        run: |
          chmod +x scripts/*.sh
          set -o pipefail
          ./scripts/build-native-deps.sh "${{ inputs.abi }}" "${{ inputs.api_level }}" "${{ github.workspace }}/native-prefix" 2>&1 | tee build.log

      - name: Commit build log (network access to raw.githubusercontent.com / api.github.com only -- Actions log storage is unreachable from the reviewing sandbox)
        if: always()
        run: |
          LOGFILE="native-libs-${{ github.run_id }}-${{ inputs.abi }}.log"
          cp build.log "/tmp/$LOGFILE" 2>/dev/null || echo "no build.log produced" > "/tmp/$LOGFILE"
          git config user.name "layercraft-ci"
          git config user.email "ci@users.noreply.github.com"
          if git fetch origin ci-logs 2>/dev/null; then
            git checkout -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p ci-logs
          cp "/tmp/$LOGFILE" "ci-logs/$LOGFILE"
          git add "ci-logs/$LOGFILE"
          git commit -m "CI log: native-libs run ${{ github.run_id }} (${{ inputs.abi }})" || echo "nothing to commit"
          git push origin ci-logs

      - name: Fail job if build step failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload prefix as artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-prefix-${{ inputs.abi }}
          path: native-prefix/
          retention-days: 7
